<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Codemon - Useless Version</title>

  <link rel="stylesheet" href="ani-style.css">
</head>

<body>

  <main class="title-screen" id="titleScreen">

    <!-- Main title artwork -->
    <img
      class="bg-layer"
      src="assets/title-screen.png"
      alt="Codemon title screen"
      draggable="false"
    >

    <!-- Animated bubbles -->
    <div
      class="bubble-layer"
      id="bubbleLayer"
      aria-hidden="true">
    </div>

    <!-- PRESS START button -->
    <button
      class="press-start-hotspot"
      id="pressStart"
      type="button"
      aria-label="Press Start">
    </button>

  </main>

  <script src="ani-script.js"></script>

  <script>
    // PRESS START → Battle screen
    document.getElementById("pressStart").addEventListener("click", function () {
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
